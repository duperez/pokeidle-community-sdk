name: Weekly checks
# The game changes without notice. Once a week: are the generated catalogs and protocol registry still in step with the
# game's public client? And do the unit tests still catch deliberate bugs in the safety code (mutation check)?
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
jobs:
  game-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run catalog:check
      - run: npm run protocol:check
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run mutation
